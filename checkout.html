<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="nav-left">
     <button onclick="window.history.back()" class="nav-button back-button">
    <i class="fas fa-arrow-left"></i> Back
  </button>
  <a href="index.html" class="nav-button">Home</a>
    </div>
    <div class="logo-container">
      <img src="images/RainyDays_Logo2.png" alt="Rainy Days Logo" class="Header-logo">
    </div>
    <div class="nav-right">
      <a href="#" class="nav-button">About Us</a>
      <div class="icon-wrapper">
        <i class="fas fa-shopping-cart"></i>
        <i class="fas fa-user"></i>
      </div>
    </div>
  </header>

  <main class="checkout-page">
    <div class="checkout-container">

      <div class="form-column">
        <h2>Shipping Details</h2>
        <form class="checkout-form">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Your full name" required>
          </div>

          <div class="form-group">
            <label for="address">Address</label>
            <input type="text" id="address" name="address" placeholder="Street address" required>
          </div>

          <div class="form-group">
            <label for="zip">ZIP Code</label>
            <input type="text" id="zip" name="zip" placeholder="12345" required>
          </div>

          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="(123) 456-7890" required>
          </div>

          <h3>Delivery Method</h3>
          <div class="form-group">
            <label><input type="radio" name="delivery" value="click" checked> Click & Collect (Free)</label><br>
            <label><input type="radio" name="delivery" value="express"> Express Shipping (Free)</label>
          </div>

          <h3>Payment Method</h3>
          <div class="form-group">
            <label><input type="radio" name="payment" value="credit" checked> Credit Card</label><br>
            <label><input type="radio" name="payment" value="paypal"> PayPal</label><br>
            <label><input type="radio" name="payment" value="bank"> Bank Transfer</label>
          </div>
        </form>
      </div>

      <div class="summary-column">
        <h2>Your Order</h2>
        <div class="summary-item">
          <img src="images/bobcat-lightweight.png" alt="Bobcat Lightweight" class="summary-image">
          <div class="summary-details">
            <h3>Bobcat Lightweight</h3>
            <p>$249.00</p>
          </div>
        </div>
        <button class="purchase-btn">Pay Now</button>
      </div>

    </div>
  </main>

  <footer>
    <div class="footer-container">
      <div class="footer-column">
        <h3>Shipping</h3>
        <p>Free shipping on orders over $100</p>
      </div>
      <div class="footer-column">
        <h3>Delivery</h3>
        <p>All orders delivered within 5 business days</p>
      </div>
      <div class="footer-column">
        <h3>Contact</h3>
        <p>123-456-7890</p>
      </div>
      <div class="footer-column">
        <h3>Follow Us</h3>
        <div class="social-links">
          <a href="https://instagram.com"><i class="fab fa-instagram"></i></a>
          <a href="https://facebook.com"><i class="fab fa-facebook"></i></a>
          <a href="https://youtube.com"><i class="fab fa-youtube"></i></a>
        </div>
      </div>
    </div>
  </footer>
</body>
</html>
